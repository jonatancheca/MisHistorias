name: Release app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare version
        shell: bash
        run: |
          version="main-${GITHUB_SHA::12}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "NUXT_PUBLIC_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "NUXT_PUBLIC_APP_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package release
        shell: bash
        run: |
          mkdir release
          (cd .output && zip -qr ../release/app.zip .)
          (cd release && sha256sum app.zip > app.zip.sha256)
          cp scripts/update.ps1 release/update.ps1

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(release/app.zip release/app.zip.sha256 release/update.ps1)
          if gh release view "$APP_VERSION" >/dev/null 2>&1; then
            gh release upload "$APP_VERSION" "${assets[@]}" --clobber
            gh release edit "$APP_VERSION" --latest
          else
            gh release create "$APP_VERSION" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "MisHistorias $APP_VERSION" \
              --generate-notes \
              --latest
          fi
