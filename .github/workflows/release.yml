name: Release app

env:
  NODE_VERSION: 24.15.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Prepare version
        shell: bash
        run: |
          version="main-${GITHUB_SHA::12}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "NUXT_PUBLIC_APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "NUXT_PUBLIC_APP_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Linux deployment scripts
        shell: bash
        run: |
          bash -n scripts/install.sh scripts/update.sh scripts/update-linux.test.sh
          bash scripts/update-linux.test.sh

      - name: Build
        run: pnpm build

      - name: Package release
        shell: bash
        run: |
          windows_node_archive="node-v${NODE_VERSION}-win-x64.zip"
          windows_node_directory="node-v${NODE_VERSION}-win-x64"
          linux_node_archive="node-v${NODE_VERSION}-linux-x64.tar.xz"
          linux_node_directory="node-v${NODE_VERSION}-linux-x64"

          mkdir -p \
            release/portable/install1 \
            release/linux-portable/install1 \
            release/node/windows \
            release/node/linux
          cp -a .output/. release/portable/install1/
          cp scripts/start.bat release/portable/start.bat
          cp scripts/update.ps1 release/portable/update.ps1
          cp scripts/release-readme.md release/portable/README.md

          cp -a .output/. release/linux-portable/install1/
          cp scripts/install.sh release/linux-portable/install.sh
          cp scripts/update.sh release/linux-portable/update.sh
          cp scripts/release-readme-linux.md release/linux-portable/README.md

          curl --fail --location --retry 3 \
            --output "release/node/windows/$windows_node_archive" \
            "https://nodejs.org/dist/v${NODE_VERSION}/$windows_node_archive"
          curl --fail --location --retry 3 \
            --output "release/node/linux/$linux_node_archive" \
            "https://nodejs.org/dist/v${NODE_VERSION}/$linux_node_archive"
          curl --fail --location --retry 3 \
            --output release/node/SHASUMS256.txt \
            "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"

          awk -v file="$windows_node_archive" '$2 == file { print }' \
            release/node/SHASUMS256.txt > release/node/windows/node.sha256
          test "$(wc -l < release/node/windows/node.sha256)" -eq 1
          (cd release/node/windows && sha256sum --check node.sha256)
          unzip -q "release/node/windows/$windows_node_archive" -d release/node/windows

          awk -v file="$linux_node_archive" '$2 == file { print }' \
            release/node/SHASUMS256.txt > release/node/linux/node.sha256
          test "$(wc -l < release/node/linux/node.sha256)" -eq 1
          (cd release/node/linux && sha256sum --check node.sha256)
          tar -xJf "release/node/linux/$linux_node_archive" -C release/node/linux

          cp "release/node/windows/$windows_node_directory/node.exe" release/portable/node.exe
          cp "release/node/windows/$windows_node_directory/LICENSE" release/portable/NODE-LICENSE.txt

          cp "release/node/linux/$linux_node_directory/bin/node" release/linux-portable/node
          cp "release/node/linux/$linux_node_directory/LICENSE" release/linux-portable/NODE-LICENSE.txt
          chmod 0755 \
            release/linux-portable/node \
            release/linux-portable/install.sh \
            release/linux-portable/update.sh

          (cd release/portable && zip -qr ../app.zip .)
          (cd release && sha256sum app.zip > app.zip.sha256)
          cp scripts/update.ps1 release/update.ps1

          (cd release/linux-portable && tar -czf ../app-linux-x64.tar.gz .)
          (cd release && sha256sum app-linux-x64.tar.gz > app-linux-x64.tar.gz.sha256)
          cp scripts/update.sh release/update.sh

          entries="$(unzip -Z1 release/app.zip)"
          for required in \
            node.exe \
            start.bat \
            update.ps1 \
            README.md \
            NODE-LICENSE.txt \
            install1/server/index.mjs \
            install1/start-server.mjs
          do
            grep -Fxq "$required" <<< "$entries"
          done
          (cd release && sha256sum --check app.zip.sha256)

          linux_entries="$(tar -tzf release/app-linux-x64.tar.gz | sed -e 's#^\./##' -e 's#/$##')"
          for required in \
            node \
            install.sh \
            update.sh \
            README.md \
            NODE-LICENSE.txt \
            install1/server/index.mjs \
            install1/start-server.mjs
          do
            grep -Fxq "$required" <<< "$linux_entries"
          done
          (cd release && sha256sum --check app-linux-x64.tar.gz.sha256)

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release/app.zip
            release/app.zip.sha256
            release/update.ps1
            release/app-linux-x64.tar.gz
            release/app-linux-x64.tar.gz.sha256
            release/update.sh
          )
          if gh release view "$APP_VERSION" >/dev/null 2>&1; then
            gh release upload "$APP_VERSION" "${assets[@]}" --clobber
            gh release edit "$APP_VERSION" --latest
          else
            gh release create "$APP_VERSION" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "MisHistorias $APP_VERSION" \
              --generate-notes \
              --latest
          fi
